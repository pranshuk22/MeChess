<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MeChess</title>
    <script>
      // set mode and palette before first paint (no flash). Light unless the player chose otherwise.
      try {
        var m = localStorage.getItem("mechess.mode") || localStorage.getItem("mechess.theme") || "light";
        var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.palette = localStorage.getItem("mechess.palette") || "slate";
      } catch (e) { document.documentElement.dataset.theme = "light"; document.documentElement.dataset.palette = "slate"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
