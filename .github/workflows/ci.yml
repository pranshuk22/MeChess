name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies (pinned)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - name: Build engine and run C++ unit tests + perft
        run: make -C engine CXX=g++ test test-verify
      - name: Python unit + integration tests
        run: .venv/bin/python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the server (pinned) and the frontend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
          cd frontend && npm ci
      - name: Type check, unit tests, build
        run: cd frontend && npx tsc --noEmit && npx vitest run && npx vite build
      - name: End-to-end tests (real server, temporary data folder)
        run: |
          cd frontend && npx playwright install --with-deps chromium
          sudo apt-get install -y stockfish || true
          MECHESS_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python npx playwright test
